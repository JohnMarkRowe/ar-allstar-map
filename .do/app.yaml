# DigitalOcean App Platform spec for a static site.
# Edit `repo` to your GitHub "owner/name", then either:
#   - point the App Platform UI at this repo (it auto-detects this file), or
#   - run:  doctl apps create --spec .do/app.yaml
name: ar-allstar-map
region: nyc
static_sites:
  - name: web
    github:
      repo: YOUR_GITHUB_USER/ar-allstar-map
      branch: main
      deploy_on_push: true        # auto-redeploy when the rebuild bot commits
    source_dir: /
    index_document: index.html
    catchall_document: index.html
